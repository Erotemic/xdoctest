[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdoctest"
dynamic = ["version"]
description = "A rewrite of the builtin doctest module"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jon Crall", email = "erotemic@gmail.com"}]
keywords = ["xdoctest", "doctest", "test", "docstr", "pytest"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []  # No mandatory runtime dependencies

[project.urls]
Homepage = "https://github.com/Erotemic/xdoctest"

[project.scripts]
xdoctest = "xdoctest.__main__:main"

[project.entry-points.pytest11]
xdoctest = "xdoctest.plugin"

[project.optional-dependencies]
# Keep these extras in sync with requirements/*.txt. In contrast to setup.py,
# PEP 621 metadata does not support the pip-only `-r` include directive.
